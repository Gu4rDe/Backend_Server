<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 24px;
        }
        .message {
            font-size: 16px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .code-box {
            background-color: #f0f4ff;
            border: 2px dashed #2563eb;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin: 24px 0;
        }
        .code-text {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #1a1a1a;
            font-family: 'Courier New', monospace;
        }
        .footer {
            font-size: 12px;
            color: #999999;
            margin-top: 32px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">&#128274; Восстановление пароля</div>
        <p class="message">
            Вы запросили сброс пароля. Используйте код ниже для восстановления доступа.
            Код действителен 1 час.
        </p>
        <div class="code-box">
            <span class="code-text">{{ reset_code }}</span>
        </div>
        <p class="message" style="margin-top: 16px;">
            Если вы не запрашивали сброс пароля, проигнорируйте это письмо.
        </p>
        <div class="footer">
            Это автоматическое письмо, отвечать на него не нужно.
        </div>
    </div>
</body>
</html>
