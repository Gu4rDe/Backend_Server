[project]
name = "backend-site"
version = "0.1.0"
description = "Face Recognition Backend API"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.13.1",
    "bcrypt==4.0.1",
    "email-validator>=2.0.0",
    "fastapi>=0.110.0",
    "insightface>=0.7.3",
    "numpy==1.26.4",
    "onnx>=1.16.0,<1.17",
    "onnxruntime>=1.16.0,<1.24",
    "opencv-python-headless>=4.8.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic>=2.0,<3.0",
    "python-dotenv==1.0.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart>=0.0.18",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.23",
    "uvicorn[standard]==0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
]
