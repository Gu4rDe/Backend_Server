    "mediapipe==0.10.9",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "passlib[bcrypt]==1.7.4",
    "pydantic>=2.0,<3.0",
    "python-dotenv==1.0.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart>=0.0.18",
    "sqlalchemy==2.0.23",
    "uvicorn[standard]==0.24.0",
]
